apiVersion: batch/v1
kind: Job
metadata:
  name: mlops-pipeline-job
spec:
  template:
    spec:
      containers:
      - name: mlops-pipeline
        image: mlops-pipeline:latest
        command: ["python"]
        args: ["mlflow_demo.py"]
        env:
        - name: MLFLOW_TRACKING_URI
          value: "http://atlantic-mlflow.default.svc.cluster.local:80"
      restartPolicy: Never
  backoffLimit: 3